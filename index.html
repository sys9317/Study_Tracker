      {q_ko:"p-value의 정확한 정의는?", q_en:"Precise definition of a p-value?", a_ko:"귀무가설이 참이라 가정했을 때 관측된 것만큼 또는 그 이상 극단적인 결과가 나올 확률. (효과 크기가 아님)", a_en:"The probability of a result at least as extreme as observed, assuming the null is true. (Not effect size.)"},
      {q_ko:"1종 오류와 2종 오류의 차이는?", q_en:"Type I vs Type II error?", a_ko:"1종(α)=참인 귀무가설 기각(거짓양성). 2종(β)=거짓인 귀무가설 채택(거짓음성).", a_en:"Type I (α) = rejecting a true null (false positive). Type II (β) = accepting a false null (false negative)."},
      {q_ko:"신뢰구간 95%의 올바른 해석은?", q_en:"Correct interpretation of a 95% CI?", a_ko:"반복 추출하면 그 구간들의 약 95%가 참 모수를 포함. (한 구간에 95% 확률이 아님)", a_en:"Across repeated sampling, ~95% of such intervals contain the true parameter. (Not 95% for one interval.)"},
    ] },

  { id:"f5", phase:"p0", week:3, day:5,
    titleKo:"상관 vs 인과 + OLS 직관", titleEn:"Correlation vs Causation + OLS",
    learnKo:"상관과 인과의 차이, OLS 회귀의 기본 직관. PPOL 5101 복습이자 Phase 3 인과추론의 디딤돌.",
    learnEn:"Correlation vs causation and basic OLS intuition. A PPOL 5101 review and the stepping-stone to Phase 3.",
    concepts:[
      { term_ko:"상관 ≠ 인과", term_en:"Correlation ≠ causation", body_ko:"두 변수가 함께 움직인다고 해서 하나가 다른 하나의 원인은 아니다. 공통 원인(교란)이나 역인과가 가짜 상관을 만들 수 있다. 예: 아이스크림 판매와 익사 사고는 둘 다 '여름(기온)'이 원인이다.", body_en:"Co-movement doesn't mean causation. A common cause (confounding) or reverse causation can create spurious correlation — e.g., ice-cream sales and drownings are both driven by summer heat." },
      { term_ko:"OLS 회귀", term_en:"OLS regression", body_ko:"최소제곱법으로 직선(또는 평면)을 데이터에 맞추는 방법이다. 계수는 '다른 변수를 고정했을 때 해당 변수 1단위 변화가 Y에 주는 평균 변화'로 해석한다.", body_en:"Fits a line/plane by minimizing squared errors. A coefficient reads as the average change in Y per one-unit change, holding others fixed." },
      { term_ko:"결정계수 R²", term_en:"R-squared", body_ko:"모형이 설명하는 종속변수 분산의 비율이다. 적합도(설명력)일 뿐 인과의 증거가 아니다. R²가 높아도 교란이나 역인과가 있을 수 있다.", body_en:"The share of the outcome's variance explained. It is goodness-of-fit, not causal evidence — a high R² can still hide confounding or reverse causation." },
      { term_ko:"교란", term_en:"Confounding", body_ko:"X와 Y 모두에 영향을 주는 제3의 변수가 가짜 관계를 만드는 현상이다. 이 변수를 통제하지 않으면 추정치가 왜곡된다(누락변수 편의).", body_en:"A third variable affecting both X and Y creates a spurious link. Failing to control for it biases the estimate (omitted-variable bias)." },
    ],
    tasks:[{label:"Econometrics Academy: Intro (영상·video)",url:"https://www.youtube.com/user/econometricsacademy"},{label:"Khan Academy: Regression",url:"https://www.khanacademy.org/math/statistics-probability/describing-relationships-quantitative-data"},{label:"GitHub: finding inspiration",url:"https://docs.github.com/en/get-started/start-your-journey/finding-inspiration-on-github"}],
    outputKo:"'상관≠인과' 사례 3개 + OLS 해석 노트", outputEn:"Three 'correlation≠causation' cases + OLS note",
    quiz:[
      {q_ko:"R²가 높으면 인과관계가 강하다고 할 수 있나?", q_en:"Does a high R² imply strong causation?", a_ko:"아니다. R²는 적합도일 뿐 인과의 증거가 아니다. 교란·역인과가 있어도 높을 수 있다.", a_en:"No. R² is goodness-of-fit, not causal evidence; it can be high even with confounding."},
      {q_ko:"회귀계수의 'ceteris paribus' 해석이란?", q_en:"The 'ceteris paribus' interpretation?", a_ko:"모형 내 다른 변수를 고정한 채 해당 변수 1단위 변화가 Y에 주는 평균 효과.", a_en:"The average effect on Y of a one-unit change, holding other model variables fixed."},
      {q_ko:"아이스크림 판매와 익사가 상관되는 이유는?", q_en:"Why are ice-cream sales and drownings correlated?", a_ko:"공통원인(기온/여름)이 둘 다 끌어올린다 — 교란에 의한 가짜 상관.", a_en:"A common cause (summer heat) drives both — spurious correlation via a confounder."},
    ] },

  { id:"f6", phase:"p0", week:3, day:6,
    titleKo:"개발/공공 경제학 + 영향평가", titleEn:"Development/Public Econ + Impact Eval",
    learnKo:"빈곤, 공공재, 시장실패, 정책개입 평가의 기본 틀. 너의 도메인 강점을 데이터와 잇는 다리이자 gui2de류 직무의 핵심 언어.",
    learnEn:"Poverty, public goods, market failure, and policy-evaluation frameworks — the bridge from your domain strength to data, and the core language of gui2de-type jobs.",
    concepts:[
      { term_ko:"공공재", term_en:"Public good", body_ko:"비경합성(한 사람의 소비가 남의 소비를 줄이지 않음)과 비배제성(대가를 안 낸 사람도 막을 수 없음)을 가진 재화다. 예: 국방, 공공보건. 시장이 충분히 공급하지 못해 정부 개입의 근거가 된다.", body_en:"A good that is non-rival (one's use doesn't reduce another's) and non-excludable (you can't stop non-payers). Markets under-supply it, justifying government provision." },
      { term_ko:"빈곤 함정", term_en:"Poverty trap", body_ko:"빈곤이 또 다른 빈곤을 낳는 자기강화 메커니즘이다. 예: 영양 부족 → 학습 저하 → 소득 저하 → 다시 영양 부족. 개입이 이 고리를 끊을 수 있는지가 핵심 질문이다.", body_en:"A self-reinforcing loop where poverty begets poverty (poor nutrition → worse learning → lower income → poor nutrition). The key question is whether an intervention can break it." },
      { term_ko:"영향평가", term_en:"Impact evaluation", body_ko:"정책이나 프로그램이 실제로 효과가 있었는지를 인과적으로 평가하는 작업이다. 단순 전후 비교가 아니라 '개입이 없었다면(반사실)'을 대조군으로 추정해 다른 시간 변화를 분리한다.", body_en:"A causal assessment of whether a program worked. Rather than before-after, it estimates the counterfactual via a control group to separate the effect from other time trends." },
      { term_ko:"무작위 통제실험", term_en:"Randomized Controlled Trial (RCT)", body_ko:"참가자를 무작위로 처치군과 대조군에 배정하는 실험이다. 무작위 배정 덕분에 두 군이 평균적으로 동일해져 교란이 제거되므로, 인과추론의 '황금률'로 불린다. gui2de의 핵심 방법론이다.", body_en:"Randomly assigns participants to treatment and control. Randomization makes the groups equivalent on average, removing confounding — the 'gold standard,' and gui2de's core method." },
    ],
    tasks:[{label:"MIT OCW 14.73 Challenge of World Poverty",url:"https://ocw.mit.edu/courses/14-73-the-challenge-of-world-poverty-spring-2011/"},{label:"World Bank: Impact Evaluation in Practice (무료 PDF)",url:"https://www.worldbank.org/en/programs/sief-trust-fund/publication/impact-evaluation-in-practice"},{label:"GitHub example-code guide",url:"https://docs.github.com/en/get-started/learning-to-code/finding-and-understanding-example-code"}],
    outputKo:"관심 정책 1개를 '평가 가능한 질문'으로 재구성", outputEn:"Reframe one policy as an 'evaluable question'",
    quiz:[
      {q_ko:"RCT가 인과추론의 '황금률'인 이유는?", q_en:"Why is an RCT the 'gold standard'?", a_ko:"무작위 배정으로 처치군·대조군이 평균적으로 동일해져 교란이 제거되기 때문.", a_en:"Random assignment makes the groups equivalent on average, eliminating confounding."},
      {q_ko:"공공재의 두 특성은?", q_en:"Two properties of a public good?", a_ko:"비경합성과 비배제성.", a_en:"Non-rivalry and non-excludability."},
      {q_ko:"영향평가가 단순 전후 비교보다 나은 이유는?", q_en:"Why is impact evaluation better than before-after?", a_ko:"반사실을 대조군으로 추정해 정책 외 시간 변화를 분리하기 때문.", a_en:"It estimates the counterfactual via a control group, separating the effect from other time trends."},
    ] },

  { id:"d4", phase:"p1", week:5, day:10,
    titleKo:"EDA + 시각화 커뮤니케이션", titleEn:"EDA + Visual Communication",
    learnKo:"탐색적 분석(변동·공변동)과 출판 품질 그래프 만들기를 익힌다.",
    learnEn:"Learn exploratory analysis (variation & covariation) and publication-quality graphics.",
    concepts:[
      { term_ko:"탐색적 데이터 분석", term_en:"EDA", body_ko:"본격 모델링 전에 데이터에 질문을 던지며 패턴·이상치·관계를 찾는 단계다. 가설을 만들고 데이터 품질을 점검하는 반복 과정이다.", body_en:"Interrogating data to find patterns, outliers, and relationships before formal modeling — iterative hypothesis-forming and quality-checking." },
      { term_ko:"변동 vs 공변동", term_en:"Variation vs Covariation", body_ko:"변동은 한 변수 내부의 흩어짐(분포)이고, 공변동은 두 변수가 함께 변하는 패턴이다. EDA의 두 핵심 질문이다.", body_en:"Variation is spread within one variable; covariation is how two variables move together. EDA's two core questions." },
      { term_ko:"labs()", term_en:"labs()", body_ko:"그래프에 제목, 부제, 축 라벨, 캡션, 범례 제목을 한 번에 다는 함수다. 출판 품질의 그림은 항상 명확한 라벨에서 시작한다.", body_en:"Sets title, subtitle, axis labels, caption, and legend titles at once. Publication-quality figures start with clear labels." },
      { term_ko:"테마", term_en:"theme()", body_ko:"폰트, 배경, 격자선 등 데이터가 아닌 시각 요소의 스타일을 조정한다. 일관된 테마는 포트폴리오의 전문성을 높인다.", body_en:"Controls non-data elements — fonts, background, gridlines. A consistent theme raises portfolio professionalism." },
    ],
    tasks:[{label:"R4DS Ch.10 EDA",url:"https://r4ds.hadley.nz/eda"},{label:"R4DS Ch.11 Communication",url:"https://r4ds.hadley.nz/communication"},{label:"Example repo: EDA report",url:"https://github.com/search?q=eda+report+quarto+example+repository&type=repositories"}],
    outputKo:"Our World in Data 데이터로 EDA Quarto 리포트", outputEn:"An EDA Quarto report on an OWID dataset",
    quiz:[
      {q_ko:"EDA의 두 핵심 질문은?", q_en:"EDA's two core questions?", a_ko:"변동(분포)과 공변동(변수 간 관계).", a_en:"Variation (distribution) and covariation (relationships)."},
      {q_ko:"제목·축라벨·캡션을 한 번에 다는 함수는?", q_en:"Function for title/labels/caption at once?", a_ko:"labs()", a_en:"labs()"},
      {q_ko:"이상치를 바로 삭제하면 안 되는 이유는?", q_en:"Why not delete outliers immediately?", a_ko:"오류일 수도, 중요한 신호일 수도 있다. 원인 확인 후 판단.", a_en:"They may be errors — or signals. Investigate before deciding."},

  { id:"d5", phase:"p1", week:6, day:11,
    titleKo:"논리·문자열·조인", titleEn:"Logicals, Strings, Joins",
    learnKo:"결측 처리, 문자열·정규식, 테이블 조인을 익힌다. 조인은 다음 Phase의 SQL과 동일 개념이다.",
    learnEn:"Missing-value handling, strings/regex, and joins. Joins are the same concept as SQL next phase.",
    concepts:[
      { term_ko:"결측값 & is.na()", term_en:"Missing values & is.na()", body_ko:"NA는 '알 수 없는 값'을 뜻한다. NA==NA 도 NA를 반환하므로 ==로는 못 잡고 is.na()로 판별한다. 평균 등은 na.rm=TRUE로 결측을 제외한다.", body_en:"NA means 'unknown.' Since NA==NA returns NA, use is.na() to detect it. Use na.rm=TRUE to drop missings in mean, etc." },
      { term_ko:"case_when()", term_en:"case_when()", body_ko:"여러 조건에 따라 다른 값을 부여하는 함수다. 여러 if-else를 깔끔하게 대체한다. 예: 소득 구간을 '저/중/고'로 분류.", body_en:"Assigns values across multiple conditions, cleanly replacing chained if-else — e.g., binning income into low/mid/high." },
      { term_ko:"정규표현식", term_en:"Regex", body_ko:"문자 패턴을 기술하는 언어다. \\d는 숫자 하나, ^는 시작, $는 끝을 뜻한다. stringr 패키지로 텍스트를 탐지·치환·추출한다.", body_en:"A language for text patterns: \\d a digit, ^ start, $ end. The stringr package detects, replaces, and extracts text." },
      { term_ko:"조인 (left vs inner)", term_en:"Joins (left vs inner)", body_ko:"left_join은 왼쪽 테이블의 모든 행을 유지하고 매칭이 없으면 NA를 채운다. inner_join은 양쪽 모두 매칭되는 행만 남긴다. 키에 중복이 있으면 행이 곱해지니 주의한다.", body_en:"left_join keeps all left rows (NA where no match); inner_join keeps only matched rows. Beware: duplicate keys multiply rows." },
    ],
    tasks:[{label:"R4DS Ch.12 Logical vectors",url:"https://r4ds.hadley.nz/logicals"},{label:"R4DS Ch.14 Strings",url:"https://r4ds.hadley.nz/strings"},{label:"R4DS Ch.19 Joins",url:"https://r4ds.hadley.nz/joins"},{label:"Example repo: joins/text cleaning",url:"https://github.com/search?q=r+joins+text+cleaning+example+repository&type=repositories"}],
    outputKo:"두 공개 데이터 조인 + 텍스트 컬럼 정제", outputEn:"Join two datasets + clean a text column",
    quiz:[
      {q_ko:"결측 판별 함수와 x==NA가 안 되는 이유는?", q_en:"Missing-value function, and why x==NA fails?", a_ko:"is.na(x). NA==NA도 NA를 반환하기 때문.", a_en:"is.na(x). Because NA==NA also returns NA."},
      {q_ko:"left_join vs inner_join은?", q_en:"left_join vs inner_join?", a_ko:"left=왼쪽 전체 유지(매칭 없으면 NA), inner=양쪽 매칭만.", a_en:"left = all left rows (NA if no match); inner = matched only."},
      {q_ko:"조인 키에 중복이 있으면?", q_en:"What if join keys have duplicates?", a_ko:"행이 곱해져(many-to-many) 데이터가 의도치 않게 불어난다.", a_en:"Rows multiply (many-to-many), inflating the data."},

  { id:"d7", phase:"p1", week:7, day:13,
    titleKo:"The Effect: DAG + back door", titleEn:"The Effect: DAGs + Back Doors",
    learnKo:"인과 식별, 인과 다이어그램(DAG), 교란경로 닫기, 통제하면 안 되는 변수를 익힌다.",
    learnEn:"Causal identification, DAGs, closing confounding paths, and which variables not to control for.",
    concepts:[
      { term_ko:"인과 다이어그램", term_en:"DAG", body_ko:"변수들 사이의 인과 관계를 화살표로 그린 그림이다. 무엇을 통제해야 하고 무엇을 통제하면 안 되는지를 시각적으로 판단하게 해준다.", body_en:"A diagram of causal relationships as arrows. It lets you reason visually about what to control for and what not to." },
      { term_ko:"교란변수", term_en:"Confounder", body_ko:"처치(X)와 결과(Y) 양쪽에 영향을 주는 공통 원인이다. 통제하지 않으면 X→Y 추정치가 왜곡된다. 통제해야 할 대표 변수다.", body_en:"A common cause of treatment (X) and outcome (Y). Left uncontrolled it biases X→Y. This is the variable you should control for." },
      { term_ko:"충돌변수", term_en:"Collider", body_ko:"두 변수의 공통 '결과'다. 통제하면 닫혀 있던 비인과 경로가 열려 가짜 상관(선택편향)이 생긴다. 절대 통제하면 안 되는 변수다.", body_en:"A common 'effect' of two variables. Controlling it opens a closed non-causal path, creating selection bias. Never control for it." },
      { term_ko:"백도어 경로", term_en:"Back-door path", body_ko:"X→Y의 인과 경로가 아니라 공통 원인을 통해 X와 Y를 잇는 비인과적 경로다. 이 경로를 (교란변수 통제로) 닫아야 편향 없는 인과효과를 얻는다.", body_en:"A non-causal path linking X and Y via a common cause. Close it (by controlling the confounder) to get an unbiased causal effect." },
    ],
    tasks:[{label:"The Effect Ch.5–8 (식별·DAG·back door)",url:"https://theeffectbook.net/ch-Identification.html"},{label:"Example repo: causal identification notebook",url:"https://github.com/search?q=causal+inference+notebook+example+repository&type=repositories"}],
    outputKo:"ggdag로 DAG 2개 + front/back door 식별", outputEn:"Draw 2 DAGs + identify front/back doors",
    quiz:[
      {q_ko:"back-door path란?", q_en:"What is a back-door path?", a_ko:"공통원인을 통해 X와 Y를 잇는 비인과 경로. 막아야 편향이 제거된다.", a_en:"A non-causal path via a common cause; closing it removes bias."},
      {q_ko:"collider를 통제하면 왜 문제인가?", q_en:"Why is controlling a collider a problem?", a_ko:"닫혀있던 비인과 경로를 열어 가짜 상관(선택편향)을 만든다.", a_en:"It opens a closed non-causal path, creating selection bias."},
      {q_ko:"교란변수를 통제 안 하면?", q_en:"What if you don't control a confounder?", a_ko:"누락변수 편의(OVB)로 추정치가 왜곡된다.", a_en:"Omitted-variable bias distorts the estimate."},
    ] },

  { id:"d8", phase:"p1", week:7, day:14,
    titleKo:"The Effect: 회귀 (Phase 1 마무리)", titleEn:"The Effect: Regression (capstone)",
    learnKo:"회귀를 '통계적 통제'의 도구로 재이해하고, 인과 관점에서 통제변수를 언제 넣는지 익힌다.",
    learnEn:"Re-understand regression as statistical adjustment; learn when to include controls from a causal view.",
    concepts:[
      { term_ko:"통계적 보정", term_en:"Statistical adjustment", body_ko:"회귀에 교란변수를 통제변수로 넣어 back-door 경로를 닫는 것이다. 이렇게 하면 처치변수의 계수가 인과효과에 더 가까워진다.", body_en:"Including confounders as controls to close back-door paths, bringing the treatment coefficient closer to the causal effect." },
      { term_ko:"세테리스 파리부스", term_en:"Ceteris paribus", body_ko:"'다른 조건이 동일할 때'라는 뜻이다. 회귀계수는 모형 내 다른 변수를 고정한 채 해당 변수 1단위 변화의 평균 효과로 해석한다.", body_en:"'Other things equal.' A coefficient is the average effect of a one-unit change, holding other model variables fixed." },
      { term_ko:"누락변수 편의", term_en:"Omitted-variable bias (OVB)", body_ko:"중요한 교란변수를 빼먹으면 생기는 편향이다. 방향은 (누락변수와 X의 상관 부호)×(누락변수와 Y의 상관 부호)로 결정된다.", body_en:"Bias from omitting an important confounder. Its direction = (sign of corr with X) × (sign of corr with Y)." },
      { term_ko:"나쁜 통제", term_en:"Bad control", body_ko:"넣으면 오히려 편향을 만드는 통제변수다. collider나 mediator가 대표적이다. R²를 올리려고 아무 변수나 넣으면 안 되는 이유다.", body_en:"A control that creates bias — typically a collider or mediator. Why you shouldn't add variables just to raise R²." },
    ],
    tasks:[{label:"The Effect Ch.13 Regression",url:"https://theeffectbook.net/ch-StatisticalAdjustment.html"},{label:"causaldata 패키지·package",url:"https://cran.r-project.org/package=causaldata"},{label:"Example repo: regression / causal memo",url:"https://github.com/search?q=causal+memo+example+repository&type=repositories"}],
    outputKo:"★ Phase 1 deliverable — Quarto EDA+회귀 리포트 커밋", outputEn:"★ Phase 1 deliverable — commit a Quarto EDA + regression report",
    quiz:[
      {q_ko:"통제변수가 인과추정에 도움 되는 경우는?", q_en:"When does a control help causal estimation?", a_ko:"그 변수가 교란변수일 때. back-door를 닫는다.", a_en:"When it's a confounder — it closes a back-door path."},
      {q_ko:"OVB의 방향은 무엇으로 결정되나?", q_en:"What determines OVB's direction?", a_ko:"누락변수와 X의 상관 부호 × 누락변수와 Y의 상관 부호.", a_en:"(Sign of corr with X) × (sign of corr with Y)."},
      {q_ko:"R²만 보고 변수를 추가하면 안 되는 이유는?", q_en:"Why not add variables just to raise R²?", a_ko:"인과 식별과 무관하고, bad control이면 오히려 편향을 만든다.", a_en:"It's irrelevant to identification, and a bad control adds bias."},
    ] },

  { id:"d10", phase:"p2", week:8, day:16,

      { term_ko:"JOIN", term_en:"JOIN", body_ko:"여러 테이블을 키로 결합한다. INNER는 양쪽 매칭만, LEFT는 왼쪽 전체를 유지한다. R/pandas의 조인과 동일한 개념이다.", body_en:"Combines tables on a key. INNER keeps matches; LEFT keeps all left rows. Same as joins in R/pandas." },

  { id:"d18b", phase:"p2", week:14, day:25,
    titleKo:"Python 계량 — statsmodels로 회귀 재현 ★", titleEn:"Python Econometrics — Replicate Regressions in statsmodels ★",
    learnKo:"R에서 한 회귀를 Python(statsmodels)으로 똑같이 재현해 결과가 일치하는지 확인한다. '도구에 독립적인' 분석가가 되는 훈련이자, Python 실무 능력을 면접에서 증명할 수 있는 산출물.",
    learnEn:"Reproduce an R regression in Python (statsmodels) and confirm the results match. This trains a tool-independent analyst and gives a Python artifact you can show in interviews.",
    concepts:[
      { term_ko:"statsmodels", term_en:"statsmodels", body_ko:"Python의 통계·계량 모델링 라이브러리다. R 스타일 공식(y ~ x1 + x2)을 지원해 OLS·로짓·프로빗을 익숙한 문법으로 돌릴 수 있고, 계수·표준오차·검정 결과를 표로 준다.", body_en:"Python's statistics/econometrics library. It supports R-style formulas (y ~ x1 + x2) for OLS, logit, and probit, and returns coefficients, standard errors, and tests in a familiar table." },
      { term_ko:"공식 API", term_en:"Formula API (smf.ols)", body_ko:"smf.ols('y ~ x1 + x2', data=df).fit()로 회귀를 적합한다. R의 lm()과 거의 같은 사고방식이라 R 사용자가 빠르게 옮겨올 수 있다.", body_en:"Fit a model with smf.ols('y ~ x1 + x2', data=df).fit(). The mental model is nearly identical to R's lm(), so R users transfer quickly." },
      { term_ko:"로버스트 표준오차", term_en:"Robust standard errors", body_ko:"이분산이 의심될 때 .fit(cov_type='HC1')로 강건 표준오차를 쓴다. 계수는 그대로지만 추론(표준오차·유의성)이 올바르게 교정된다.", body_en:"When heteroskedasticity is suspected, use .fit(cov_type='HC1') for robust SEs. Coefficients stay the same, but inference (SEs, significance) is corrected." },
      { term_ko:"교차검증(도구 독립성)", term_en:"Cross-checking (tool independence)", body_ko:"같은 데이터·같은 모형이면 R lm()과 statsmodels의 계수가 일치해야 한다. 불일치하면 변수 코딩·결측 처리·표본 차이를 의심하는 디버깅 습관이 길러진다.", body_en:"With the same data and model, R's lm() and statsmodels coefficients must match. A mismatch points to differences in variable coding, missing-data handling, or sample — building a debugging habit." },
    ],
    tasks:[{label:"statsmodels: OLS & formula API (docs)",url:"https://www.statsmodels.org/stable/regression.html"},{label:"statsmodels: example notebooks repo",url:"https://github.com/statsmodels/statsmodels/tree/main/examples"},{label:"Causal Inference for the Brave and True (Python)",url:"https://matheusfacure.github.io/python-causality-handbook/"}],
    outputKo:"★ R에서 한 회귀를 Python으로 재현 → 계수 일치 확인 노트북 (R↔Python 나란히) → 포트폴리오 항목", outputEn:"★ A notebook reproducing an R regression in Python with matching coefficients (R↔Python side by side) → a portfolio piece",
    quiz:[
      {q_ko:"R 스타일 공식으로 OLS를 돌리는 statsmodels API는?", q_en:"Which statsmodels API runs OLS with an R-style formula?", a_ko:"smf.ols('y ~ x1 + x2', data=df).fit() (statsmodels.formula.api)", a_en:"smf.ols('y ~ x1 + x2', data=df).fit() (statsmodels.formula.api)"},
      {q_ko:"R lm()과 statsmodels 계수가 달라야 정상인가?", q_en:"Should R lm() and statsmodels coefficients differ?", a_ko:"아니다. 같은 데이터·모형이면 일치해야 한다. 다르면 변수 코딩/결측 처리/표본 차이를 의심한다.", a_en:"No. With the same data and model they must match. A difference signals coding, missing-data, or sample differences."},
      {q_ko:"이분산이 의심될 때 무엇을 바꾸나?", q_en:"What do you change when heteroskedasticity is suspected?", a_ko:"로버스트(HC) 표준오차를 쓴다. 계수는 그대로, 표준오차·추론이 교정된다.", a_en:"Use robust (HC) standard errors. Coefficients are unchanged; SEs and inference are corrected."},
    ] },

  { id:"c0", phase:"p3", week:15, day:26,
    titleKo:"RCT 설계 + 검정력 분석 ★", titleEn:"RCT Design + Power Analysis ★",
    learnKo:"실험을 시작하기 '전에' 표본 크기를 정하는 검정력 분석. 너의 RCT 현장경험(OYE Kenya)을 '설계까지 할 수 있다'로 끌어올리는 핵심 조각이자, J-PAL·World Bank DIME·gui2de가 직접 요구하는 역량이다.",
    learnEn:"Power analysis sizes a study 'before' it runs. This is the piece that lifts your field RCT experience (OYE Kenya) to 'can design one,' and a skill J-PAL, World Bank DIME, and gui2de ask for directly.",
    concepts:[
      { term_ko:"검정력", term_en:"Statistical power", body_ko:"실제로 효과가 존재할 때 그것을 통계적으로 탐지해낼 확률(1−β)이다. 보통 0.8을 목표로 한다. 표본이 작으면 검정력이 낮아 진짜 효과도 '유의하지 않다'고 잘못 결론낸다(2종 오류).", body_en:"The probability (1−β) of detecting an effect that truly exists; usually targeted at 0.8. With small samples, power is low and a real effect is wrongly called 'not significant' (Type II error)." },
      { term_ko:"최소탐지효과(MDE)", term_en:"Minimum Detectable Effect (MDE)", body_ko:"주어진 표본·검정력으로 통계적으로 탐지 가능한 '가장 작은 효과 크기'다. 정책적으로 의미 있는 효과(예: 교육 0.5년 증가)를 잡을 만큼 표본이 충분한지 판단하는 기준이 된다.", body_en:"The smallest effect a given sample and power can detect. It tells you whether your sample is large enough to catch a policy-meaningful effect (e.g., +0.5 years of schooling)." },
      { term_ko:"효과크기 & 분산", term_en:"Effect size & variance", body_ko:"표본 크기는 효과가 작을수록, 결과의 분산(σ)이 클수록 더 커야 한다. calibration 데이터로 이 둘을 추정해 계산에 넣는다 — gui2de 과제 4가 calibration 데이터를 준 이유다.", body_en:"Required sample grows as the effect shrinks and as outcome variance (σ) rises. You estimate both from a calibration dataset to plug in — exactly why gui2de's Exercise 4 provided one." },
      { term_ko:"군집 무작위 & ICC", term_en:"Clustered RCT & ICC", body_ko:"학교·마을 단위로 처치를 배정하면(군집 RCT), 같은 군집 내 개인들이 비슷해 정보량이 줄어든다. 급내상관(ICC)이 클수록 필요한 표본이 크게 늘어난다. 설계에서 반드시 반영해야 한다.", body_en:"When treatment is assigned by school or village (clustered RCT), individuals within a cluster are similar, reducing information. A higher intra-cluster correlation (ICC) sharply raises the required sample. Designs must account for it." },
    ],
    tasks:[{label:"J-PAL: Power Calculations (research resource)",url:"https://www.povertyactionlab.org/resource/power-calculations"},{label:"EGAP: Power Analysis 10 Things to Know",url:"https://egap.org/resource/10-things-to-know-about-statistical-power/"},{label:"R: pwr 패키지 vignette",url:"https://cran.r-project.org/web/packages/pwr/vignettes/pwr-vignette.html"},{label:"Stata: power command (docs)",url:"https://www.stata.com/manuals/pss.pdf"}],
    outputKo:"★ calibration 데이터로 표본 크기 계산 (R pwr 또는 Stata power) + 모든 가정을 적은 방법론 노트 → 포트폴리오 항목", outputEn:"★ Sample-size calc from a calibration dataset (R pwr or Stata power) + a methodology note listing every assumption → a portfolio piece",
    quiz:[
      {q_ko:"잡으려는 효과가 작아지면 필요한 표본 크기는 어떻게 되나?", q_en:"As the effect you want to detect gets smaller, what happens to required sample size?", a_ko:"커진다. 작은 효과는 노이즈에 묻히기 쉬워, 구분해내려면 더 많은 관측치가 필요하다.", a_en:"It grows. Smaller effects are easily masked by noise, so more observations are needed to distinguish them."},
      {q_ko:"검정력 0.8의 의미는?", q_en:"What does power = 0.8 mean?", a_ko:"실제로 효과가 있을 때 그것을 유의하게 탐지할 확률이 80%라는 뜻. 즉 20%는 진짜 효과를 놓친다(2종 오류).", a_en:"An 80% chance of detecting an effect that truly exists. The other 20% miss it (Type II error)."},
      {q_ko:"군집 RCT에서 ICC가 크면 표본은?", q_en:"In a clustered RCT, what does a high ICC do to sample size?", a_ko:"필요한 표본이 늘어난다. 같은 군집 내 개인이 비슷해 새 정보가 적기 때문이다.", a_en:"It increases the required sample, because individuals within a cluster are similar and add little new information."},
    ] },

  { id:"c1", phase:"p3", week:16, day:27,
    titleKo:"고정효과 (Fixed Effects)", titleEn:"Fixed Effects",
    learnKo:"패널 데이터에서 관측 안 되는 시간불변 교란을 제거하는 고정효과. 인과추론 실전의 기본기이자 gui2de 같은 RCT 연구소의 일상 도구.",
    learnEn:"Fixed effects remove unobserved time-invariant confounders in panel data — a workhorse of applied causal inference and daily tooling at RCT labs like gui2de.",
    concepts:[
      { term_ko:"패널 데이터", term_en:"Panel data", body_ko:"같은 개체(국가·개인·기업 등)를 여러 시점에 걸쳐 반복 관측한 데이터다. 같은 개체를 여러 번 봤다는 점이 인과추론에 강력한 지렛대가 된다.", body_en:"Data observing the same units (countries, people, firms) over multiple periods. Seeing the same unit repeatedly is a powerful lever for causal inference." },
      { term_ko:"고정효과", term_en:"Fixed effects", body_ko:"개체나 시간마다 고유한 더미를 넣어 그 차원의 모든 시간불변(또는 개체불변) 특성을 흡수·통제하는 기법이다. 관측되지 않은 교란도 제거할 수 있는 게 큰 장점이다.", body_en:"Adding a dummy per unit or time to absorb all time-invariant (or unit-invariant) traits along that dimension. Its strength is removing even unobserved confounders." },
      { term_ko:"개체 내 추정량", term_en:"Within estimator", body_ko:"고정효과는 결국 '각 개체 내부의 변동'만 사용해 효과를 추정한다. 개체 간 비교가 아니라 같은 개체의 시점 간 변화에서 정보를 얻는다.", body_en:"Fixed effects ultimately use only 'within-unit variation,' drawing information from changes over time within the same unit rather than across units." },
      { term_ko:"양방향 고정효과", term_en:"Two-way fixed effects", body_ko:"개체 고정효과와 시간 고정효과를 동시에 넣는 방식이다. 시간불변 개체 특성과 모든 개체에 공통인 시간 충격을 함께 통제한다. DiD의 기본 형태이기도 하다.", body_en:"Including both unit and time fixed effects, controlling time-invariant unit traits and common time shocks together. It's also the basic DiD form." },
    ],
    tasks:[{label:"The Effect Ch.16 Fixed Effects",url:"https://theeffectbook.net/ch-FixedEffects.html"},{label:"Mixtape: Panel Data",url:"https://mixtape.scunning.com/08-panel_data"},{label:"fixest feols() 문서",url:"https://lrberge.github.io/fixest/"},{label:"Example repo: panel-data notebook",url:"https://github.com/search?q=panel+data+notebook+example+repository&type=repositories"}],
    outputKo:"World Bank 국가-연도 패널로 양방향 고정효과 모형", outputEn:"A two-way FE model on a WB country-year panel",
    quiz:[
      {q_ko:"양방향 고정효과는 무엇을 통제하나?", q_en:"What does two-way FE control for?", a_ko:"개체 FE로 시간불변 개체특성, 시간 FE로 공통 시간충격을 통제.", a_en:"Unit FE for time-invariant unit traits; time FE for common time shocks."},
      {q_ko:"고정효과가 통제 못하는 교란은?", q_en:"What confounding can FE not handle?", a_ko:"시간에 따라 변하는(time-varying) 개체별 교란요인.", a_en:"Time-varying, unit-specific confounders."},
      {q_ko:"fixest에서 FE를 지정하는 문법은?", q_en:"fixest syntax for FEs?", a_ko:"feols(y ~ x | id + year, data=df) — | 뒤에 고정효과.", a_en:"feols(y ~ x | id + year, data=df) — FEs after the |."},
    ] },

  { id:"c2", phase:"p3", week:17, day:28,
    titleKo:"이중차분 DiD (고전 + 현대)", titleEn:"Difference-in-Differences (classic + modern)",
    learnKo:"처치군의 전후 변화를 대조군 변화로 보정하는 DiD. 정책평가의 표준이며, 현대의 staggered(시차 도입) 이슈와 최신 추정량까지 본다.",
    learnEn:"DiD adjusts a treatment group's before-after change by the control group's change. The policy-eval standard — through to modern staggered-adoption issues and new estimators.",
    concepts:[
      { term_ko:"이중차분", term_en:"Difference-in-Differences (DiD)", body_ko:"처치군의 (사후−사전) 변화에서 대조군의 (사후−사전) 변화를 빼서 정책 효과를 추정한다. 두 군에 공통으로 작용한 시간 추세를 상쇄하는 것이 핵심이다.", body_en:"Estimates the effect as the treatment group's (after−before) change minus the control group's, canceling the time trend common to both." },
      { term_ko:"평행추세 가정", term_en:"Parallel trends", body_ko:"DiD의 핵심 식별 가정이다. 처치가 없었다면 두 군이 같은 추세를 따랐을 것이라는 전제다. 처치 전 기간의 추세 비교로 점검한다.", body_en:"DiD's key identifying assumption: absent treatment, both groups would have followed the same trend. Checked by comparing pre-treatment trends." },
      { term_ko:"시차 도입", term_en:"Staggered adoption", body_ko:"여러 집단이 서로 다른 시점에 처치를 받는 상황이다. 전통적 양방향 FE는 이 경우 '이미 처치된 집단'을 비교군으로 잘못 쓰는 편향이 생길 수 있다.", body_en:"When different groups are treated at different times. Traditional two-way FE can be biased here by wrongly using already-treated groups as controls." },
      { term_ko:"Callaway-Sant'Anna 추정량", term_en:"Callaway-Sant'Anna estimator", body_ko:"시차 도입 상황의 편향을 바로잡는 현대 DiD 추정량이다. R의 did 패키지로 구현하며, 집단·시점별 효과를 적절히 집계한다.", body_en:"A modern DiD estimator correcting staggered-adoption bias, implemented in R's did package by properly aggregating group-time effects." },
    ],
    tasks:[{label:"The Effect Ch.18 DiD",url:"https://theeffectbook.net/ch-DifferenceinDifference.html"},{label:"MRU: Intro to DiD (영상·video)",url:"https://mru.org/mastering-econometrics-joshua-angrist"},{label:"did 패키지 (Callaway & Sant'Anna)",url:"https://bcallaway11.github.io/did/articles/did-basics.html"},{label:"Example repo: DiD project",url:"https://github.com/search?q=difference+in+differences+example+repository&type=repositories"}],
    outputKo:"고전 2×2 DiD(fixest) → 시차도입 DiD(did::att_gt) 비교", outputEn:"Classic 2×2 DiD vs staggered DiD (did::att_gt)",
    quiz:[
      {q_ko:"DiD의 핵심 식별 가정은?", q_en:"DiD's key identifying assumption?", a_ko:"평행추세 — 처치 없었다면 두 군이 같은 추세를 따랐을 것.", a_en:"Parallel trends — absent treatment, both groups would follow the same trend."},
      {q_ko:"전통적 TWFE가 staggered에서 편향되는 이유는?", q_en:"Why is traditional TWFE biased under staggered adoption?", a_ko:"이미 처치된 집단이 비교군으로 잘못 쓰이는 'forbidden comparison' 때문.", a_en:"Because already-treated groups get used as controls — a 'forbidden comparison.'"},
      {q_ko:"평행추세를 점검하는 방법은?", q_en:"How to check parallel trends?", a_ko:"처치 전 추세 비교(event-study 사전계수가 0 근처인지 확인).", a_en:"Compare pre-treatment trends (event-study pre-coefficients near zero)."},
    ] },

  { id:"c3", phase:"p3", week:18, day:29,
    titleKo:"도구변수(IV) + 이벤트 스터디", titleEn:"Instrumental Variables + Event Studies",
    learnKo:"내생성 문제를 도구변수로 해결하는 2SLS와, 처치 전후 동학을 보는 이벤트 스터디. 관측 데이터에서 인과를 끌어내는 강력한 도구.",
    learnEn:"2SLS solves endogeneity via instruments; event studies trace pre/post dynamics. Powerful tools for extracting causality from observational data.",
    concepts:[
      { term_ko:"내생성", term_en:"Endogeneity", body_ko:"설명변수가 오차항과 상관되어 OLS 추정치가 편향되는 문제다. 누락변수, 역인과, 측정오차가 주요 원인이다. 도구변수가 대표적 해결책이다.", body_en:"When a regressor correlates with the error term, biasing OLS. Main causes: omitted variables, reverse causation, measurement error. Instruments are a key fix." },
      { term_ko:"도구변수", term_en:"Instrument", body_ko:"내생변수와는 상관되지만 결과변수에는 오직 그 내생변수를 '통해서만' 영향을 주는 변수다. 두 조건(관련성, 배제제약)을 모두 만족해야 유효하다.", body_en:"A variable correlated with the endogenous regressor but affecting the outcome only through it. Valid only if both relevance and the exclusion restriction hold." },
      { term_ko:"2단계 최소제곱", term_en:"2SLS (Two-Stage Least Squares)", body_ko:"1단계에서 도구로 내생변수를 예측하고, 2단계에서 그 예측값으로 결과를 회귀한다. 1단계 F통계량으로 도구의 강도를 점검한다(대략 >10).", body_en:"Stage 1 predicts the endogenous variable from instruments; stage 2 regresses the outcome on those predictions. Check instrument strength via the first-stage F (roughly >10)." },
      { term_ko:"배제 제약", term_en:"Exclusion restriction", body_ko:"도구가 결과에 직접적인 경로 없이 오직 내생변수를 통해서만 영향을 준다는 가정이다. 검정 불가능하므로 이론·맥락으로 정당화해야 한다.", body_en:"The assumption that the instrument affects the outcome only through the endogenous variable, with no direct path. Untestable — must be justified by theory and context." },
    ],
    tasks:[{label:"The Effect Ch.19 IV / Ch.17 Event Studies",url:"https://theeffectbook.net/ch-InstrumentalVariables.html"},{label:"Mixtape: Instrumental Variables",url:"https://mixtape.scunning.com/07-instrumental_variables"},{label:"MRU: Intro to IV (영상·video)",url:"https://mru.org/mastering-econometrics-joshua-angrist"},{label:"Example repo: IV / event-study notebook",url:"https://github.com/search?q=instrumental+variables+example+repository&type=repositories"}],
    outputKo:"2SLS 추정 + 1단계 진단(first-stage F)", outputEn:"A 2SLS estimate with first-stage diagnostics",
    quiz:[
      {q_ko:"유효한 도구변수의 두 조건은?", q_en:"Two conditions for a valid instrument?", a_ko:"관련성(내생변수와 상관)+배제제약(결과엔 내생변수 통해서만).", a_en:"Relevance (correlated with the endogenous var) + exclusion (affects outcome only through it)."},
      {q_ko:"약한 도구 문제의 점검 지표는?", q_en:"How to check for a weak instrument?", a_ko:"1단계 F통계량(대략 >10).", a_en:"The first-stage F-statistic (roughly >10)."},
      {q_ko:"이벤트 스터디는 무엇을 보여주나?", q_en:"What does an event study show?", a_ko:"처치 시점 기준 상대시간별 효과 — 사전추세 점검과 동적 효과를 동시에.", a_en:"Effects by time relative to treatment — checking pre-trends and dynamic effects at once."},
    ] },

  { id:"c4", phase:"p3", week:19, day:30,
    titleKo:"회귀불연속(RDD) + 강건성", titleEn:"Regression Discontinuity + Robustness",
    learnKo:"컷오프 근처의 준실험을 이용하는 RDD와, 결과의 견고함을 점검하는 민감도 분석. ★ Phase 3 인과 파트 마무리 — causal repo 커밋.",
    learnEn:"RDD exploits a quasi-experiment near a cutoff; sensitivity analysis checks robustness. ★ Closes the causal half of Phase 3 — commit the causal repo.",
    concepts:[
      { term_ko:"회귀불연속 설계", term_en:"Regression Discontinuity (RDD)", body_ko:"어떤 연속 점수가 컷오프를 넘느냐에 따라 처치가 결정될 때, 컷오프 바로 위·아래를 비교해 인과효과를 추정한다. 경계 근처에서는 처치 여부 말고는 거의 같다고 본다.", body_en:"When treatment depends on whether a continuous score crosses a cutoff, compare just above vs just below. Near the boundary, units differ only in treatment." },
      { term_ko:"러닝 변수", term_en:"Running variable", body_ko:"처치 여부를 결정하는 연속 점수다(예: 시험 점수, 소득 기준선). 이 변수의 컷오프에서 결과가 점프하는지를 본다.", body_en:"The continuous score determining treatment (e.g., a test score, an income threshold). You look for a jump in the outcome at its cutoff." },
      { term_ko:"대역폭", term_en:"Bandwidth", body_ko:"컷오프 주변에서 분석에 포함할 구간의 폭이다. 좁으면 편향은 줄지만 분산이 커지고, 넓으면 반대다. 최적 대역폭 선택과 민감도 점검이 중요하다.", body_en:"The window around the cutoff used for analysis. Narrow = less bias but more variance; wide = the reverse. Optimal-bandwidth choice and sensitivity checks matter." },
      { term_ko:"민감도 분석", term_en:"Sensitivity analysis", body_ko:"핵심 가정을 조금씩 완화했을 때 결론이 얼마나 흔들리는지 점검하는 것이다(예: HonestDiD). 결과가 가정에 과도하게 의존하지 않음을 보여 신뢰도를 높인다.", body_en:"Checking how much conclusions move when key assumptions are relaxed (e.g., HonestDiD). It shows results don't hinge on fragile assumptions, raising credibility." },
    ],
    tasks:[{label:"The Effect Ch.20 RDD",url:"https://theeffectbook.net/ch-RegressionDiscontinuity.html"},{label:"Mixtape: Regression Discontinuity",url:"https://mixtape.scunning.com/06-regression_discontinuity"},{label:"rdrobust 패키지",url:"https://rdpackages.github.io/rdrobust/"},{label:"HonestDiD (민감도·sensitivity)",url:"https://github.com/asheshrambachan/HonestDiD"},{label:"Example repo: RDD project",url:"https://github.com/search?q=regression+discontinuity+example+repository&type=repositories"}],
    outputKo:"★ RDD 플롯+추정 → causal-inference-projects repo 커밋", outputEn:"★ An RDD plot+estimate → commit to causal-inference-projects",
    quiz:[
      {q_ko:"RDD의 핵심 식별 가정은?", q_en:"RDD's key identifying assumption?", a_ko:"연속성 — 처치를 제외한 모든 것이 컷오프에서 연속.", a_en:"Continuity — everything except treatment is continuous at the cutoff."},
      {q_ko:"대역폭이 좁으면?", q_en:"If the bandwidth is narrow?", a_ko:"편향↓ 분산↑. 최적대역폭+민감도 점검이 필요하다.", a_en:"Less bias, more variance. Needs optimal-bandwidth choice + sensitivity checks."},
      {q_ko:"sharp vs fuzzy RDD는?", q_en:"Sharp vs fuzzy RDD?", a_ko:"sharp=처치확률 0→1 점프, fuzzy=부분 변화(IV처럼 처리).", a_en:"Sharp: treatment probability jumps 0→1; fuzzy: partial change (handled like IV)."},
    ] },

  { id:"c5", phase:"p3", week:20, day:31,
    titleKo:"ML 기초: 편향-분산 · 교차검증", titleEn:"ML Foundations: Bias-Variance, CV",
    learnKo:"예측 모델링의 토대 — 편향-분산 균형과 교차검증. tidymodels 워크플로를 세팅한다. 여기서부터 ML 파트가 시작된다.",
    learnEn:"The foundation of prediction — the bias-variance tradeoff and cross-validation. Set up the tidymodels workflow; the ML half begins here.",
    concepts:[
      { term_ko:"편향-분산 균형", term_en:"Bias-variance tradeoff", body_ko:"단순한 모델은 편향이 크고 분산이 작으며, 복잡한 모델은 그 반대다. 총 예측오차를 최소화하는 적절한 복잡도를 찾는 것이 핵심이다.", body_en:"Simple models have high bias, low variance; complex models the reverse. The goal is the complexity that minimizes total prediction error." },
      { term_ko:"과적합", term_en:"Overfitting", body_ko:"모델이 훈련데이터의 우연한 잡음까지 학습해 새 데이터에서 성능이 떨어지는 것이다. 분산이 큰 복잡한 모델에서 흔하다.", body_en:"Learning the training data's random noise, hurting new-data performance. Common in complex, high-variance models." },
      { term_ko:"k-겹 교차검증", term_en:"k-fold cross-validation", body_ko:"데이터를 k조각으로 나눠 각 조각이 한 번씩 검증셋이 되게 k번 학습·평가한 뒤 평균낸다. 단일 분할보다 성능 추정이 안정적이고 데이터를 효율적으로 쓴다.", body_en:"Split data into k folds; train/evaluate k times so each fold is the validation set once, then average. More stable than a single split and uses data efficiently." },
      { term_ko:"tidymodels", term_en:"tidymodels", body_ko:"R의 모델링 프레임워크다. rsample(분할), recipes(전처리), parsnip(모델), yardstick(평가)을 일관된 문법으로 묶어 ML 워크플로를 깔끔하게 만든다.", body_en:"R's modeling framework tying rsample (splitting), recipes (preprocessing), parsnip (models), and yardstick (metrics) into one consistent ML workflow." },
    ],
    tasks:[{label:"ISLR Ch.2 & Ch.5 (Statistical Learning, Resampling)",url:"https://www.statlearning.com/"},{label:"StatQuest ML playlist (영상·video)",url:"https://www.youtube.com/playlist?list=PLblh5JKOoLUICTaGLRoHQDuF_7q2GfuJF"},{label:"Tidy Modeling with R",url:"https://www.tmwr.org/"},{label:"Example repo: ML workflow",url:"https://github.com/search?q=machine+learning+workflow+example+repository&type=repositories"}],
    outputKo:"tidymodels로 train/test 분할 + k-fold CV 워크플로", outputEn:"A tidymodels train/test split + k-fold CV workflow",
    quiz:[
      {q_ko:"k-fold CV를 단일 분할보다 선호하는 이유는?", q_en:"Why prefer k-fold CV over a single split?", a_ko:"모두가 한 번씩 검증셋 → 추정 분산↓, 데이터 효율↑.", a_en:"Every fold serves as validation once → lower estimate variance, better data use."},
      {q_ko:"과적합이란?", q_en:"What is overfitting?", a_ko:"훈련데이터 잡음까지 학습해 새 데이터 성능 저하.", a_en:"Learning training noise so new-data performance drops."},
      {q_ko:"편향-분산 균형이란?", q_en:"The bias-variance tradeoff?", a_ko:"단순=편향↑분산↓, 복잡=편향↓분산↑. 총오차 최소점을 찾는다.", a_en:"Simple = high bias/low variance; complex = the reverse. Find the total-error minimum."},
    ] },

  { id:"c6", phase:"p3", week:21, day:32,
    titleKo:"정규화: Ridge / Lasso / Elastic Net", titleEn:"Regularization: Ridge / Lasso / Elastic Net",
    learnKo:"과적합을 막고 변수를 선택하는 정규화. Lasso의 변수선택 효과는 변수가 많은 정책 데이터에서 특히 유용하다.",
    learnEn:"Regularization curbs overfitting and selects variables. Lasso's variable selection is especially useful in high-dimensional policy data.",
    concepts:[
      { term_ko:"정규화", term_en:"Regularization", body_ko:"회귀계수에 페널티를 부과해 모델이 너무 복잡해지는 것을 억제하는 기법이다. 과적합을 줄이고 일반화 성능을 높인다.", body_en:"Imposing a penalty on coefficients to keep a model from getting too complex — reducing overfitting and improving generalization." },
      { term_ko:"릿지 (L2)", term_en:"Ridge (L2)", body_ko:"계수의 제곱합에 페널티를 준다. 계수를 0에 가깝게 줄이지만 정확히 0으로 만들지는 않는다. 상관 높은 변수들을 안정적으로 다룬다.", body_en:"Penalizes the sum of squared coefficients, shrinking them toward zero but not exactly to zero. Handles correlated predictors stably." },
      { term_ko:"라쏘 (L1)", term_en:"Lasso (L1)", body_ko:"계수의 절댓값합에 페널티를 준다. 일부 계수를 정확히 0으로 만들어 자동 변수선택 효과가 있다. 해석 가능한 희소 모델을 만든다.", body_en:"Penalizes the sum of absolute coefficients, driving some exactly to zero — automatic variable selection, producing an interpretable sparse model." },
      { term_ko:"람다 (페널티 강도)", term_en:"Lambda (penalty strength)", body_ko:"페널티의 세기를 정하는 하이퍼파라미터다. 크면 모델이 단순해지고(편향↑), 작으면 복잡해진다(분산↑). 교차검증으로 최적값을 고른다.", body_en:"The hyperparameter setting penalty strength. Larger = simpler model (more bias); smaller = more complex (more variance). Chosen by cross-validation." },
    ],
    tasks:[{label:"ISLR Ch.6 Regularization",url:"https://www.statlearning.com/"},{label:"StatQuest: Ridge/Lasso/Elastic Net (영상·video)",url:"https://www.youtube.com/playlist?list=PLblh5JKOoLUICTaGLRoHQDuF_7q2GfuJF"},{label:"HOML 정규화 회귀 장",url:"https://bradleyboehmke.github.io/HOML/"},{label:"Example repo: regularization notebook",url:"https://github.com/search?q=lasso+ridge+example+repository&type=repositories"}],
    outputKo:"교차검증 lambda를 쓴 Lasso + 계수 경로 플롯", outputEn:"A CV-tuned Lasso + coefficient-path plot",
    quiz:[
      {q_ko:"Ridge(L2)와 Lasso(L1)의 핵심 차이는?", q_en:"Key difference between Ridge and Lasso?", a_ko:"Ridge는 0 근처로 축소(유지), Lasso는 일부를 정확히 0으로 만들어 변수선택.", a_en:"Ridge shrinks toward zero (keeps all); Lasso zeros some out for variable selection."},
      {q_ko:"lambda가 커지면 모델은?", q_en:"What happens as lambda grows?", a_ko:"페널티↑ → 계수↓, 모델 단순화(편향↑·분산↓).", a_en:"Stronger penalty → smaller coefficients, simpler model (more bias, less variance)."},
      {q_ko:"Elastic Net은 무엇을 결합?", q_en:"What does Elastic Net combine?", a_ko:"L1+L2 — 변수선택(Lasso)과 상관변수 안정성(Ridge)을 절충.", a_en:"L1+L2 — balancing Lasso's selection with Ridge's stability on correlated predictors."},
    ] },

  { id:"c7", phase:"p3", week:22, day:33,

    learnEn:"Decision trees capture nonlinearity; random forests average many trees for stability. Plus variable importance for interpretation.",
    concepts:[
      { term_ko:"의사결정나무", term_en:"Decision tree", body_ko:"데이터를 조건에 따라 가지치기하며 예측하는 모델이다. 직관적이고 비선형·상호작용을 자연스럽게 잡지만, 단독으로는 과적합되기 쉽다.", body_en:"A model that splits data by conditions to predict. Intuitive and naturally captures nonlinearity and interactions, but prone to overfitting alone." },
      { term_ko:"배깅", term_en:"Bagging", body_ko:"데이터를 부트스트랩(복원추출)으로 여러 번 뽑아 모델을 만들고 그 예측을 평균/투표로 결합하는 기법이다. 분산을 줄여 안정성을 높인다.", body_en:"Bootstrap-sampling the data many times, building a model on each, and averaging/voting predictions. It reduces variance for stability." },
      { term_ko:"랜덤 포레스트", term_en:"Random forest", body_ko:"배깅에 더해 각 분기마다 변수의 무작위 부분집합만 고려하는 기법이다. 나무들 사이의 상관을 낮춰 단일 나무보다 훨씬 강건하고 정확하다.", body_en:"Bagging plus considering only a random subset of variables at each split. This decorrelates trees, making it far more robust and accurate than a single tree." },
      { term_ko:"변수 중요도", term_en:"Variable importance", body_ko:"각 변수가 예측 성능(불순도 감소 등)에 얼마나 기여했는지의 순위다. 블랙박스 모델의 해석에 첫 단서를 준다(vip 패키지).", body_en:"A ranking of how much each variable contributes to prediction (e.g., impurity reduction). A first clue for interpreting black-box models (vip package)." },
    ],
    tasks:[{label:"ISLR Ch.8 Tree-Based Methods",url:"https://www.statlearning.com/"},{label:"StatQuest: Decision Trees, Random Forests (영상·video)",url:"https://www.youtube.com/playlist?list=PLblh5JKOoLUICTaGLRoHQDuF_7q2GfuJF"},{label:"HOML 의사결정나무/랜덤포레스트",url:"https://bradleyboehmke.github.io/HOML/DT.html"},{label:"Example repo: tree-based model notebook",url:"https://github.com/search?q=random+forest+example+repository&type=repositories"}],

    quiz:[

      {q_ko:"배깅의 핵심 아이디어는?", q_en:"Core idea of bagging?", a_ko:"부트스트랩 샘플로 여러 모델을 만들고 평균/투표로 결합.", a_en:"Build models on bootstrap samples and combine by averaging/voting."},
      {q_ko:"변수 중요도가 알려주는 것은?", q_en:"What does variable importance tell you?", a_ko:"각 변수의 예측 기여(불순도 감소 등) 순위.", a_en:"A ranking of each variable's contribution to prediction."},
    ] },

    concepts:[

      { term_ko:"XGBoost", term_en:"XGBoost", body_ko:"경사 부스팅을 고속·고성능으로 구현한 라이브러리다. 정형 데이터(표 형태)에서 자주 최고 성능을 내며 캐글·실무에서 널리 쓰인다.", body_en:"A fast, high-performance gradient-boosting library. It often tops the leaderboard on tabular data and is widely used in Kaggle and industry." },

      { term_ko:"SHAP", term_en:"SHAP", body_ko:"게임이론에 기반해 '각 변수가 이 한 건의 예측에 얼마나 기여했는가'를 일관되게 계산하는 해석 도구다. 블랙박스 모델을 설명해 정책 활용 신뢰를 높인다.", body_en:"A game-theory-based tool computing each variable's contribution to a single prediction, consistently. It explains black-box models, boosting trust for policy use." },

    outputKo:"★ XGBoost vs 랜덤포레스트 벤치마크 + SHAP 플롯 → ml-projects repo", outputEn:"★ XGBoost vs RF benchmark + SHAP plot → ml-projects repo",

      {q_ko:"학습률이 작으면?", q_en:"If the learning rate is small?", a_ko:"단계 보정이 작아 트리가 더 필요하나 일반화가 보통 향상.", a_en:"Smaller updates need more trees but usually generalize better."},

function StudyTracker() {
  const [done, setDone] = useState({});
  const [openQuiz, setOpenQuiz] = useState({});
  const [showAns, setShowAns] = useState({});
  const [activePhase, setActivePhase] = useState("p0");
  const [lang, setLang] = useState("both");
  const [loaded, setLoaded] = useState(false);
  const STORAGE_KEY = "study_tracker_v7";

  useEffect(() => {
    try {
      const r = window.localStorage.getItem(STORAGE_KEY);
      if (r) setDone(JSON.parse(r));
    } catch(e){}
    setLoaded(true);
  }, []);
  useEffect(() => { if(!loaded) return; try { window.localStorage.setItem(STORAGE_KEY, JSON.stringify(done)); } catch(e){} }, [done, loaded, STORAGE_KEY]);

  const toggle = (id) => setDone((d) => ({ ...d, [id]: !d[id] }));
  const toggleQuiz = (id) => setOpenQuiz((q) => ({ ...q, [id]: !q[id] }));
  const toggleAns = (k) => setShowAns((a) => ({ ...a, [k]: !a[k] }));

  const totalDone = Object.values(done).filter(Boolean).length;
  const totalDays = DAYS.length;
  const pct = Math.round((totalDone / Math.max(totalDays,1)) * 100);
  const phaseDays = (pid) => DAYS.filter((d) => d.phase === pid);
  const phaseDone = (pid) => phaseDays(pid).filter((d) => done[d.id]).length;
  const ap = PHASES.find((p) => p.id === activePhase);
  const C = ap.color, BG = ap.bg;

  const weeks = [];
  phaseDays(activePhase).forEach((d) => { let w = weeks.find((x) => x.week === d.week); if (!w) { w = { week:d.week, days:[] }; weeks.push(w); } w.days.push(d); });

  const showKo = lang === "ko" || lang === "both";
  const showEn = lang === "en" || lang === "both";

  const classifyTask = (task = {}) => {
    if (task.type) return task.type;
    const label = task.label || "";
    const s = label.toLowerCase();
    if (s.includes("video") || s.includes("영상") || s.includes("lecture") || s.includes("lesson") || s.includes("intro") || s.includes("course")) return "watch";
    if (s.includes("official") || s.includes("docs") || s.includes("guide") || s.includes("getting started") || s.includes("tutorial") || s.includes("handbook") || s.includes("book") || s.includes("r4ds") || s.includes("the effect") || s.includes("week")) return "read";
    if (s.includes("example repo") || s.includes("example") || s.includes("repo") || s.includes("github") || s.includes("portfolio") || s.includes("project")) return "example";
    if (s.includes("practice") || s.includes("quiz") || s.includes("exercise") || s.includes("problem") || s.includes("learn") || s.includes("challenge") || s.includes("exercise")) return "practice";
    return "other";
  };

  const groupTasks = (tasks = []) => tasks.reduce((acc, t) => {
    const key = classifyTask(t);
    acc[key].push(t);
    return acc;
  }, { watch: [], read: [], example: [], practice: [], other: [] });

  const FONT = "'Inter','Pretendard','Apple SD Gothic Neo','Malgun Gothic',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif";
  const INK = "#1a1a1a", INK2 = "#333333", INK3 = "#52525b";

  return (
    <div style={{ minHeight:"100vh", background:"#f5f3ee", fontFamily:FONT, color:INK, paddingBottom:60, fontSize:16 }}>
      {/* header */}
      <div style={{ background:"#15171c", color:"#fff", padding:"30px 24px 26px", borderBottom:"4px solid "+C }}>
        <div style={{ fontSize:12, fontWeight:700, letterSpacing:"0.2em", color:"#a7b0c0", textTransform:"uppercase", marginBottom:10 }}>Bilingual Lecture Tracker · v7 · 한국어 / English</div>
        <div style={{ fontSize:26, fontWeight:800, lineHeight:1.2, letterSpacing:"-0.01em" }}>Applied Microeconomics · Econometrics · Applied Data Science</div>
        <div style={{ fontSize:15, color:"#d4d8e0", marginTop:9, fontWeight:500 }}>“MIDP concentrated in applied microeconomics, econometrics, and applied data science”</div>
        <div style={{ fontSize:12.5, color:"#aeb4c0", marginTop:6, fontWeight:600 }}>Target roles: policy · research assistant/associate · data analyst/scientist (non-CS)</div>

        <div style={{ display:"flex", gap:7, marginTop:18 }}>
          {[["both","한 + EN"],["ko","한국어"],["en","English"]].map(([v,label])=>(
            <button key={v} onClick={()=>setLang(v)} style={{ fontSize:13, fontWeight:700, padding:"6px 14px", borderRadius:8, cursor:"pointer", border:"2px solid "+(lang===v?C:"#3a3f4b"), background:lang===v?C:"transparent", color:lang===v?"#fff":"#c0c5d0" }}>{label}</button>
          ))}
        </div>

        <div style={{ marginTop:18 }}>
          <div style={{ display:"flex", justifyContent:"space-between", fontSize:13, fontWeight:700, marginBottom:7, color:"#d4d8e0" }}><span>{showKo?"전체 진행":""}{showKo&&showEn?" · ":""}{showEn?"Progress":""}</span><span>{totalDone} / {totalDays} · {pct}%</span></div>
          <div style={{ height:10, background:"#2a2e38", borderRadius:99, overflow:"hidden" }}><div style={{ height:"100%", width:pct+"%", background:C, borderRadius:99, transition:"width .4s" }} /></div>
        </div>
      </div>

      {/* phase tabs */}
      <div style={{ display:"flex", padding:"0 10px", background:"#15171c", overflowX:"auto" }}>
        {PHASES.map((p) => { const active = p.id===activePhase; return (
          <button key={p.id} onClick={()=>setActivePhase(p.id)} style={{ flex:"1 0 auto", minWidth:124, border:"none", cursor:"pointer", background:active?p.bg:"transparent", color:active?p.color:"#aeb4c0", padding:"12px 13px 14px", textAlign:"left", borderTop:active?"4px solid "+p.color:"4px solid transparent", fontFamily:FONT }}>
            <div style={{ fontSize:11, fontWeight:700, letterSpacing:"0.05em", opacity:0.9 }}>{p.name} · {p.weeks}</div>
            <div style={{ fontSize:13.5, fontWeight:800, marginTop:3, lineHeight:1.25 }}>{p.title}</div>
            <div style={{ fontSize:11.5, fontWeight:700, marginTop:5, opacity:0.85 }}>{phaseDone(p.id)}/{phaseDays(p.id).length}</div>
          </button> ); })}
      </div>

      {/* goal */}
      <div style={{ maxWidth:820, margin:"0 auto", padding:"22px 20px 0" }}>
        <div style={{ background:BG, border:"2px solid "+C+"44", borderLeft:"5px solid "+C, borderRadius:12, padding:"15px 17px" }}>
          {showKo && <div style={{ fontSize:14.5, lineHeight:1.65, color:INK }}><strong style={{ color:C, fontWeight:800 }}>목표.</strong> {ap.goalKo}</div>}
          {showEn && <div style={{ fontSize:13.5, lineHeight:1.6, color:INK2, marginTop:showKo?7:0 }}><strong style={{ color:C, fontWeight:800 }}>Goal.</strong> {ap.goalEn}</div>}
          <div style={{ fontSize:12.5, lineHeight:1.5, color:INK3, marginTop:9, fontWeight:600 }}>▸ {ap.deliverable}</div>
        </div>

        <div style={{ marginTop:12, background:"#fff", border:"1.5px solid "+C+"33", borderRadius:12, padding:"14px 16px", boxShadow:"0 1px 3px rgba(0,0,0,0.04)" }}>
          <div style={{ fontSize:11.5, fontWeight:800, color:C, letterSpacing:"0.12em", marginBottom:10, textTransform:"uppercase" }}>COURSE FLOW · 오늘 수업 듣는 법</div>
          <div style={{ display:"grid", gridTemplateColumns: showKo && showEn ? "repeat(2,minmax(0,1fr))" : "1fr", gap:10 }}>
            <div style={{ background:"#f8f5ef", borderRadius:10, padding:"11px 12px", border:"1px solid "+C+"22" }}>
              <div style={{ fontSize:12.5, fontWeight:800, color:INK }}>1) Lecture links · 강의 링크</div>
              <div style={{ fontSize:12.8, color:INK2, lineHeight:1.6, marginTop:5 }}>
                {showKo && "오늘 수업의 링크를 위에서 아래 순서로 클릭해서 듣는다."}
                {showKo && showEn && <span style={{ color:"#b8a99b" }}> · </span>}
                {showEn && "Open the links top-to-bottom to follow today’s lesson order."}
              </div>
            </div>
            <div style={{ background:"#f8f5ef", borderRadius:10, padding:"11px 12px", border:"1px solid "+C+"22" }}>
              <div style={{ fontSize:12.5, fontWeight:800, color:INK }}>2) Notes · 필기</div>
              <div style={{ fontSize:12.8, color:INK2, lineHeight:1.6, marginTop:5 }}>
                {showKo && "핵심 개념 박스는 수업 노트다. 읽고, 필요한 경우 캡처해서 따로 정리한다."}
                {showKo && showEn && <span style={{ color:"#b8a99b" }}> · </span>}
                {showEn && "The concept boxes are your lecture notes. Read them and capture the parts you need."}
              </div>
            </div>
            <div style={{ background:"#f8f5ef", borderRadius:10, padding:"11px 12px", border:"1px solid "+C+"22" }}>
              <div style={{ fontSize:12.5, fontWeight:800, color:INK }}>3) Assignment · 실습 과제</div>
              <div style={{ fontSize:12.8, color:INK2, lineHeight:1.6, marginTop:5 }}>
                {showKo && "과제는 '오늘 배운 걸 손으로 직접 해보는 부분'이다."}
                {showKo && showEn && <span style={{ color:"#b8a99b" }}> · </span>}
                {showEn && "The assignment is where you do the work yourself and prove you understood it."}
              </div>
            </div>
            <div style={{ background:"#f8f5ef", borderRadius:10, padding:"11px 12px", border:"1px solid "+C+"22" }}>
              <div style={{ fontSize:12.5, fontWeight:800, color:INK }}>4) Review · 복습</div>
              <div style={{ fontSize:12.8, color:INK2, lineHeight:1.6, marginTop:5 }}>
                {showKo && "퀴즈를 닫았다가 다시 열어 정답까지 확인하면 그날 수업이 끝난다."}
                {showKo && showEn && <span style={{ color:"#b8a99b" }}> · </span>}
                {showEn && "Close the quiz, reopen it, and check the answer to finish the lesson."}
              </div>
            </div>
          </div>
        </div>
      </div>

      <div style={{ maxWidth:820, margin:"0 auto", padding:"12px 20px 0" }}>
        <div style={{ background:"#fff", border:"1.5px solid #ddd6c8", borderRadius:12, padding:"14px 16px", boxShadow:"0 1px 3px rgba(0,0,0,0.04)" }}>
          <div style={{ fontSize:11.5, fontWeight:800, color:C, letterSpacing:"0.12em", marginBottom:10, textTransform:"uppercase" }}>CLASS MAP · course navigation</div>
          <div style={{ display:"flex", flexWrap:"wrap", gap:8, marginBottom:12 }}>
            {PHASES.map((p) => (
              <button
                key={p.id}
                onClick={() => setActivePhase(p.id)}
                style={{
                  border:"1.5px solid "+(activePhase===p.id ? p.color : "#d7d0c4"),
                  background:activePhase===p.id ? p.bg : "#faf8f4",
                  color:activePhase===p.id ? p.color : INK2,
                  borderRadius:999,
                  padding:"7px 12px",
                  cursor:"pointer",
                  fontSize:12.5,
                  fontWeight:800,
                  fontFamily:FONT
                }}
              >
                {p.name} · {p.title}
              </button>
            ))}
          </div>
          <div style={{ display:"grid", gridTemplateColumns: showKo && showEn ? "repeat(2,minmax(0,1fr))" : "1fr", gap:10 }}>
            <div style={{ background:"#f8f5ef", borderRadius:10, padding:"11px 12px", border:"1px solid "+C+"22" }}>
              <div style={{ fontSize:12.5, fontWeight:800, color:INK }}>How to use · 사용 순서</div>
              <div style={{ fontSize:12.8, color:INK2, lineHeight:1.6, marginTop:5 }}>
                {showKo && "위의 Phase 탭으로 단원을 고른 뒤, 각 day의 Watch / Read / Example repo 링크를 순서대로 클릭한다."}
                {showKo && showEn && <span style={{ color:"#b8a99b" }}> · </span>}
                {showEn && "Choose a phase above, then open each day’s Watch / Read / Example repo links in order."}
              </div>
            </div>
            <div style={{ background:"#f8f5ef", borderRadius:10, padding:"11px 12px", border:"1px solid "+C+"22" }}>
              <div style={{ fontSize:12.5, fontWeight:800, color:INK }}>Comparison · 비교 방법</div>
              <div style={{ fontSize:12.8, color:INK2, lineHeight:1.6, marginTop:5 }}>
                {showKo && "원본 버전과 강의형 버전을 각각 다른 폴더로 실행하면 동시에 열어 비교할 수 있다."}
                {showKo && showEn && <span style={{ color:"#b8a99b" }}> · </span>}
                {showEn && "Run the original and lecture versions in separate folders to compare them side by side."}
              </div>
            </div>
          </div>
        </div>
      </div>

      {/* days */}
      <div style={{ maxWidth:820, margin:"0 auto", padding:"8px 20px" }}>
        {weeks.map((w) => (
          <div key={w.week} style={{ marginTop:20 }}>
            <div style={{ fontSize:13, fontWeight:800, letterSpacing:"0.12em", textTransform:"uppercase", color:"#8a8f9a", marginBottom:11, borderBottom:"2px solid #ddd9d0", paddingBottom:7 }}>Week {w.week}</div>
            {w.days.map((d) => { const isDone=!!done[d.id]; const qOpen=!!openQuiz[d.id]; return (
              <div key={d.id} style={{ background:"#fff", borderRadius:14, marginBottom:12, border:"2px solid "+(isDone?C:"#e5e1d8"), overflow:"hidden", boxShadow:isDone?"none":"0 1px 3px rgba(0,0,0,0.05)", opacity:isDone?0.9:1 }}>
                <div style={{ display:"flex", alignItems:"flex-start", gap:13, padding:"16px 17px" }}>
                  <button onClick={()=>toggle(d.id)} style={{ flexShrink:0, marginTop:1, width:26, height:26, borderRadius:8, border:"2.5px solid "+(isDone?C:"#c4c0b6"), background:isDone?C:"#fff", color:"#fff", cursor:"pointer", fontSize:15, fontWeight:800, display:"flex", alignItems:"center", justifyContent:"center", fontFamily:FONT }}>{isDone?"✓":""}</button>
                  <div style={{ flex:1, minWidth:0 }}>
                    <div style={{ display:"flex", alignItems:"baseline", gap:9, flexWrap:"wrap" }}>
                      <span style={{ fontSize:12, fontWeight:800, color:"#fff", background:C, padding:"3px 10px", borderRadius:7 }}>Day {d.day}</span>
                      {showKo && <span style={{ fontSize:17, fontWeight:800, color:INK, textDecoration:isDone?"line-through":"none" }}>{d.titleKo}</span>}
                      {showEn && <span style={{ fontSize:showKo?13.5:17, fontWeight:showKo?600:800, color:showKo?INK3:INK, textDecoration:isDone?"line-through":"none" }}>{showKo?"· "+d.titleEn:d.titleEn}</span>}
                    </div>

                    {/* learn */}
                    <div style={{ marginTop:10 }}>
                      {showKo && <div style={{ fontSize:14, color:INK2, lineHeight:1.65, fontWeight:500 }}>{d.learnKo}</div>}
                      {showEn && <div style={{ fontSize:13, color:INK3, lineHeight:1.6, marginTop:showKo?4:0, fontWeight:500 }}>{d.learnEn}</div>}
                    </div>

                    {/* lesson flow */}
                    <div style={{ marginTop:13, background:"#f7f4ef", border:"1.5px solid "+C+"44", borderRadius:11, padding:"14px 15px" }}>
                      <div style={{ fontSize:11.5, fontWeight:800, color:C, letterSpacing:"0.1em", marginBottom:10 }}>LESSON FLOW · 오늘 수업 루틴</div>
                      <div style={{ fontSize:12.5, lineHeight:1.6, color:INK2, marginBottom:10, fontWeight:600 }}>
                        {showKo && "링크를 위에서 아래로 따라가면 오늘 수업이 끝까지 이어진다."}
                        {showKo && showEn && <span style={{ color:"#b8a99b" }}> · </span>}
                        {showEn && "Follow the links from top to bottom and you’ll complete today’s class."}
                      </div>
                      {(() => {
                        const grouped = groupTasks(d.tasks);
                        const sections = [
                          ["1. Watch · 듣기", grouped.watch],
                          ["2. Read · 읽기", grouped.read],
                          ["3. Example repo · 예제", grouped.example],
                          ["4. Practice · 실습", grouped.practice],
                          ["5. Other links · 기타", grouped.other],
                        ].filter(([, items]) => items.length > 0);
                        return (
                          <div style={{ display:"flex", flexDirection:"column", gap:9 }}>
                            {sections.map(([title, items]) => (
                              <div key={title}>
                                <div style={{ fontSize:12.5, fontWeight:800, color:INK, marginBottom:7 }}>{title}</div>
                                <div style={{ display:"flex", flexDirection:"column", gap:7 }}>
                                  {items.map((t,i)=>(
                                    <a key={i} href={t.url} target="_blank" rel="noopener noreferrer" style={{ display:"flex", alignItems:"center", gap:9, fontSize:13.2, color:C, textDecoration:"none", padding:"8px 12px", borderRadius:9, background:"#fff", border:"1.5px solid "+C+"33", fontWeight:600 }}>
                                      <span style={{ fontWeight:800, fontSize:13 }}>↗</span>
                                      <span style={{ flex:1 }}>{t.label}</span>
                                    </a>
                                  ))}
                                </div>
                              </div>
                            ))}
                          </div>
                        );
                      })()}
                    </div>

                    {/* concepts */}
                    <div style={{ marginTop:13, background:"#fafaf8", border:"1.5px solid "+C+"33", borderRadius:11, padding:"14px 15px" }}>
                      <div style={{ fontSize:11.5, fontWeight:800, color:C, letterSpacing:"0.1em", marginBottom:11 }}>KEY CONCEPTS · 핵심 개념</div>
                      <div style={{ display:"flex", flexDirection:"column", gap:13 }}>
                        {d.concepts.map((c,i)=>(
                          <div key={i} style={{ borderLeft:"3px solid "+C, paddingLeft:13 }}>
                            <div style={{ fontSize:14.5, fontWeight:800, color:INK, lineHeight:1.4 }}>
                              {showKo && c.term_ko}{showKo&&showEn && <span style={{ color:"#cbb" }}> · </span>}{showEn && <span style={{ color:C }}>{c.term_en}</span>}
                            </div>
                            {showKo && <div style={{ fontSize:13.5, color:INK2, lineHeight:1.7, marginTop:4, fontWeight:500 }}>{c.body_ko}</div>}
                            {showEn && <div style={{ fontSize:12.5, color:INK3, lineHeight:1.65, marginTop:showKo?5:4, fontWeight:500 }}>{c.body_en}</div>}
                          </div>
                        ))}
                      </div>
                    </div>

                    {/* output */}
                    <div style={{ marginTop:11, fontSize:13.5, color:INK2, lineHeight:1.55, fontWeight:500 }}>
                      <span style={{ fontWeight:800, color:C, fontSize:11.5, letterSpacing:"0.06em" }}>ASSIGNMENT · 과제 </span>
                      {showKo && d.outputKo}{showKo&&showEn && " · "}{showEn && <span style={{ color:INK3 }}>{d.outputEn}</span>}
                    </div>

                    {/* quiz */}
                    <button onClick={()=>toggleQuiz(d.id)} style={{ marginTop:12, fontSize:13, fontWeight:700, background:qOpen?C:"#fff", color:qOpen?"#fff":C, border:"2px solid "+C, borderRadius:9, padding:"7px 14px", cursor:"pointer", fontFamily:FONT }}>{qOpen?"▾ 복습문제 · Review "+d.quiz.length:"▸ 복습문제 · Review "+d.quiz.length}</button>
                    {qOpen && (<div style={{ marginTop:10, display:"flex", flexDirection:"column", gap:9 }}>
                      {d.quiz.map((qz,qi)=>{ const key=d.id+"_"+qi; const aOpen=!!showAns[key]; return (
                        <div key={qi} style={{ background:BG, borderRadius:11, padding:"13px 15px", border:"1.5px solid "+C+"44" }}>
                          <div style={{ fontSize:14, fontWeight:700, color:INK, lineHeight:1.55 }}>
                            <span style={{ color:C, fontWeight:800 }}>Q{qi+1}. </span>{showKo && qz.q_ko}{showKo&&showEn && <span style={{ color:INK3, fontWeight:600 }}> · {qz.q_en}</span>}{!showKo && qz.q_en}
                          </div>
                          <button onClick={()=>toggleAns(key)} style={{ marginTop:8, cursor:"pointer", fontSize:12.5, fontWeight:700, color:C, background:"transparent", border:"none", padding:0, fontFamily:FONT }}>{aOpen?"▾ 정답 · Answer":"정답 보기 · Show answer →"}</button>
                          {aOpen && <div style={{ marginTop:9, paddingTop:9, borderTop:"1.5px dashed "+C+"66" }}>
                            {showKo && <div style={{ fontSize:13.5, color:INK, lineHeight:1.7, fontWeight:500 }}>{qz.a_ko}</div>}
                            {showEn && <div style={{ fontSize:12.5, color:INK3, lineHeight:1.65, marginTop:showKo?5:0, fontWeight:500 }}>{qz.a_en}</div>}
                          </div>}
                        </div> ); })}
                    </div>)}
                  </div>
                </div>
              </div> ); })}
          </div>
        ))}
      </div>

      <div style={{ maxWidth:820, margin:"28px auto 0", padding:"0 20px" }}>
        <div style={{ background:"#15171c", color:"#fff", borderRadius:14, padding:"17px 19px", fontSize:13.5, lineHeight:1.75, fontWeight:500 }}>
          {showKo && <div><strong style={{fontWeight:800}}>v7 — adds RCT & power analysis.</strong> 각 day는 `강의 링크 → 공식 문서 → 예제 repo → 실습 과제 → 복습 문제` 순서로 설계했어. 언어를 바꾸고, 링크를 눌러 수업을 듣고, 체크박스로 진행도를 쌓으면 돼. 진행 상황은 이 브라우저에 저장돼.</div>}
          {showEn && <div style={{ marginTop:showKo?9:0, color:"#c8cdd6" }}><strong style={{fontWeight:800, color:"#fff"}}>v7 — adds RCT & power analysis.</strong> Each day is structured as `lecture links → official docs → example repo → assignment → review`. Switch languages, follow the links, and use the checkboxes to track progress. Progress is saved in this browser.</div>}
        </div>
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<StudyTracker />);
</script>
</body>
</html>
